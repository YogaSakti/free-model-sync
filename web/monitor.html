<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Model Sync</title><style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#edf1f6;--surface:#fff;--surface-2:#f7f9fc;--text:#18202c;--muted:#647184;--border:rgba(15,23,42,.12);--accent:#1976d2;--success:#207a48;--danger:#c43d3d;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select{font:inherit}button,select{min-height:42px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text)}button{cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff}.danger{color:var(--danger)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.page{width:min(1080px,100%);margin:auto;padding:24px}.header,.actions,.picker,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.header{justify-content:space-between;align-items:flex-start}.header p,.note,.url,.status{color:var(--muted)}.panel,.provider{border:1px solid var(--border);border-radius:14px;background:var(--surface)}.panel{padding:18px;margin-top:16px}.provider{display:grid;grid-template-columns:1fr auto;gap:14px;padding:15px;margin-top:12px}.provider h2{margin:0 0 4px;font-size:1rem}.url{margin:0;font:.78rem ui-monospace,SFMono-Regular,Menlo,monospace}.badges{display:flex;gap:7px;margin-top:9px}.badge{padding:4px 8px;border:1px solid var(--border);border-radius:999px;font-size:.72rem}.badge.good{color:var(--success)}.models{grid-column:1/-1;border-top:1px solid var(--border);padding-top:12px}.models summary{cursor:pointer;font-size:.82rem;font-weight:700;color:var(--muted)}.tools{margin:10px 0}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:7px}.check{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);font:.75rem ui-monospace,SFMono-Regular,Menlo,monospace}.check input{width:17px;height:17px}.picker{margin:12px 0}.picker select{min-width:220px}.empty{padding:24px;text-align:center;border:1px dashed var(--border);border-radius:10px;color:var(--muted)}.status{min-height:1.4em}.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px}.toast{max-width:360px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:700}.toast.success{color:var(--success)}.toast.error{color:var(--danger)}@media(max-width:700px){.page{padding:14px}.header,.provider{display:grid;grid-template-columns:1fr}.actions button{flex:1}}@media(prefers-color-scheme:dark){:root{--bg:#0b111c;--surface:#111a28;--surface-2:#182334;--text:#edf3fa;--muted:#a7b2c1;--border:rgba(255,255,255,.12);--accent:#56a8ff;--success:#7bd9a4;--danger:#ff8a8a}}
</style></head><body><main class="page"><header class="header"><div><h1>Free Model Sync</h1><p>Fetch free model catalogs, choose active models, then save explicitly.</p></div><button id="reload">Reload providers</button></header><p id="status" class="status" role="status"></p><section class="panel"><h2>AI providers</h2><p class="note">Monitoring state stores provider IDs only. Model selection is read from and written to <code>openai-compatibility.models</code>.</p><div class="picker"><select id="picker" aria-label="Provider to monitor"><option value="">Add a provider…</option></select><button id="add">Add provider</button></div><div id="providers"><p class="empty">Loading…</p></div></section></main><div id="toasts" class="toasts" aria-live="polite"></div><script>
(()=>{'use strict';
const AUTH_KEY='cli-proxy-auth',PREFIX='enc::v1::',SALT='cli-proxy-api-webui::secure-storage',REFRESH_MS=60*60*1000,routes={providers:'/v0/management/openai-compatibility',config:'/v0/management/plugins/free-model-sync/config',plan:'/v0/management/plugins/free-model-sync/plan'};
const root=document.getElementById('providers'),picker=document.getElementById('picker'),status=document.getElementById('status'),toasts=document.getElementById('toasts');let providers=[],config={},monitors={};const catalogs=new Map();
function decode(v){if(!v||!v.startsWith(PREFIX))return v;const k=new TextEncoder().encode(`${SALT}|${location.host}|${navigator.userAgent}`),b=atob(v.slice(PREFIX.length)),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i)^k[i%k.length];return new TextDecoder().decode(o)}
function key(){try{const x=JSON.parse(decode(localStorage.getItem(AUTH_KEY))),s=x&&x.state?x.state:x;if(s&&s.managementKey)return s.managementKey}catch(_){}try{return JSON.parse(decode(localStorage.getItem('managementKey')))||''}catch(_){return''}}
async function api(path,method='GET',body){const response=await fetch(path,{method,headers:{Authorization:`Bearer ${key()}`,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let value={};try{value=await response.json()}catch(_){}if(!response.ok)throw new Error(value.error||value.message||`Request failed (${response.status})`);return value}
function toast(message,tone){const n=document.createElement('div');n.className=`toast ${tone}`;n.textContent=message;toasts.append(n);setTimeout(()=>n.remove(),4000)}function id(p){return`${p.name||''}\n${p['base-url']||''}`}function models(p){return Array.isArray(p.models)?p.models:[]}function apiKey(p){const x=(p['api-key-entries']||[]).find(x=>x&&x['api-key']);return x?x['api-key']:''}function freeName(name){return String(name).toLowerCase().split(/[-_:/.]/).includes('free')}function normalize(v){const out={};if(v&&typeof v==='object')for(const [k,s]of Object.entries(v))if(s&&typeof s==='object')out[k]={enabled:s.enabled===true,managed:[...new Set((s.managed||[]).map(String).filter(name=>!freeName(name)))]};return out}
function needsCleanup(v){return !!(v&&typeof v==='object'&&Object.values(v).some(s=>s&&typeof s==='object'&&Object.keys(s).some(k=>k!=='enabled'&&k!=='managed')))}
async function saveMonitors(){config={...config,monitors};await api(routes.config,'PATCH',{monitors})}
function monitored(){return providers.filter(p=>monitors[id(p)]&&monitors[id(p)].enabled)}
function renderPicker(){picker.replaceChildren(new Option('Add a provider…',''));for(const p of providers){const s=monitors[id(p)];if(!p.disabled&&!(s&&s.enabled))picker.add(new Option(p.name||p['base-url'],id(p)))}}
function render(){renderPicker();root.textContent='';const rows=monitored();if(!rows.length){root.innerHTML='<p class="empty">No providers monitored.</p>';return}for(const p of rows){const pid=id(p),state=monitors[pid],catalog=catalogs.get(pid),free=catalog?catalog.free:models(p).filter(m=>freeName(m.name)).map(m=>String(m.name)),active=new Set(models(p).map(m=>String(m.name))),card=document.createElement('article'),info=document.createElement('div'),title=document.createElement('h2'),url=document.createElement('p'),badges=document.createElement('div'),configured=document.createElement('span'),count=document.createElement('span'),actions=document.createElement('div'),fetchButton=document.createElement('button'),stop=document.createElement('button'),details=document.createElement('details'),summary=document.createElement('summary'),tools=document.createElement('div'),all=document.createElement('button'),none=document.createElement('button'),save=document.createElement('button'),checks=document.createElement('div');card.className='provider';title.textContent=p.name;url.className='url';url.textContent=p['base-url'];badges.className='badges';configured.className='badge';configured.textContent=`${models(p).length} configured`;count.className='badge good';count.textContent=`${free.filter(x=>active.has(x)).length}/${free.length} free active`;badges.append(configured,count);info.append(title,url,badges);actions.className='actions';fetchButton.textContent='Refresh catalog';stop.textContent='Stop monitoring';stop.className='danger';actions.append(fetchButton,stop);details.className='models';summary.textContent=`Free models (${free.filter(x=>active.has(x)).length}/${free.length} active)`;tools.className='tools';all.textContent='Enable all';none.textContent='Disable all';save.textContent='Save selection';save.className='primary';save.disabled=!catalogs.has(pid);tools.append(all,none,save);checks.className='checks';details.append(summary,tools,checks);card.append(info,actions,details);root.append(card);for(const name of free){const label=document.createElement('label'),input=document.createElement('input');label.className='check';input.type='checkbox';input.dataset.model=name;input.checked=active.has(name);label.append(input,document.createTextNode(name));checks.append(label)}if(!free.length)checks.textContent='Fetch the catalog to see all available free models.';all.onclick=()=>checks.querySelectorAll('input').forEach(x=>x.checked=true);none.onclick=()=>checks.querySelectorAll('input').forEach(x=>x.checked=false);fetchButton.onclick=async()=>{fetchButton.disabled=true;try{const result=await fetchCatalog(p);catalogs.set(pid,result);render();const next=[...root.querySelectorAll('.provider')].find(x=>x.querySelector('h2')?.textContent===p.name);if(next)next.querySelector('details').open=true;toast(`${p.name}: ${result.free.length} free models found.`,'success')}catch(e){toast(e.message,'error')}finally{fetchButton.disabled=false}};save.onclick=async()=>{save.disabled=true;try{const selected=new Set([...checks.querySelectorAll('input:checked')].map(x=>x.dataset.model)),freeSet=new Set(free),owned=new Set(state.managed),manual=models(p).filter(m=>{const name=String(m.name);return !freeSet.has(name)&&!freeName(name)&&!owned.has(name)}),source=new Map((catalog.models||[]).map(m=>[String(m.name),m])),next=[...manual,...free.filter(name=>selected.has(name)).map(name=>source.get(name)||{name,alias:name.split('/').pop().replace(/[:_.-]free$/,'')})];state.managed=free.filter(name=>selected.has(name)&&!freeName(name));await saveMonitors();await api(routes.providers,'PATCH',{name:p.name,value:{models:next}});p.models=next;catalogs.set(pid,result.free);count.textContent=`${selected.size}/${result.free.length} free active`;summary.textContent=`Free models (${selected.size}/${result.free.length} active)`;toast(`${p.name}: selection saved.`,'success')}catch(e){toast(e.message,'error')}finally{save.disabled=false}};stop.onclick=async()=>{monitors[pid]={enabled:false};try{await saveMonitors();render()}catch(e){monitors[pid]={enabled:true};toast(e.message,'error')}}}}
async function fetchCatalog(p){return api(routes.plan,'POST',{base_url:p['base-url'],api_key:apiKey(p),managed:[],models:models(p)})}
async function refreshCatalogs(notify=false){const rows=monitored(),results=await Promise.allSettled(rows.map(async p=>{const result=await fetchCatalog(p);catalogs.set(id(p),result);return p.name}));render();if(notify){const failed=results.filter(x=>x.status==='rejected').length;toast(failed?`${failed} catalog refresh${failed===1?'':'es'} failed.`:`${rows.length} catalogs refreshed.`,failed?'error':'success')}}
async function load(){try{const [pp,cp]=await Promise.all([api(routes.providers),api(routes.config)]);providers=(pp['openai-compatibility']||[]).filter(p=>p&&p['base-url']);config=cp||{};const cleanup=needsCleanup(config.monitors);monitors=normalize(config.monitors);const valid=new Set(providers.map(id));let changed=false;for(const k of Object.keys(monitors))if(!valid.has(k)){delete monitors[k];changed=true}for(const p of providers){const pid=id(p);if(!(pid in monitors)&&!p.disabled&&models(p).some(m=>freeName(m.name))){monitors[pid]={enabled:true,managed:[]};changed=true}}if(changed||cleanup)await saveMonitors();render();status.textContent=`Loading ${monitored().length} monitored catalog${monitored().length===1?'':'s'}…`;await refreshCatalogs();status.textContent=`Loaded ${monitored().length} monitored provider${monitored().length===1?'':'s'}.`}catch(e){status.textContent=e.message;toast(e.message,'error')}}
document.getElementById('add').onclick=async()=>{const p=providers.find(p=>id(p)===picker.value);if(!p)return;monitors[id(p)]={enabled:true,managed:[]};try{await saveMonitors();render()}catch(e){toast(e.message,'error')}};document.getElementById('reload').onclick=async()=>{await refreshCatalogs(true)};load();setInterval(()=>void refreshCatalogs(),REFRESH_MS);
})();
</script></body></html>
