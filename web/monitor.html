<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Model Sync</title><style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172338;background:#f4f8ff;--bg:#f4f8ff;--surface:#fff;--surface-2:#f7faff;--text:#172338;--muted:#697991;--border:#dce7f5;--accent:#2864dc;--accent-dark:#1e4fb8;--success:#18794e;--danger:#b42332}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;background:linear-gradient(145deg,#eaf3ff 0%,#f7faff 46%,#edf4ff 100%);color:var(--text)}
button,input,select{font:inherit}
button,select{min-height:42px;padding:9px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
button{cursor:pointer;font-weight:650;transition:background-color .15s,border-color .15s,color .15s}
button:hover:not(:disabled){border-color:#a9c3ec;background:#f2f7ff}
button:disabled{cursor:wait;opacity:.65}
.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.primary:hover:not(:disabled){border-color:var(--accent-dark);background:var(--accent-dark);color:#fff}
.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{width:min(1120px,100%);margin:auto;padding:30px 24px}
.header,.actions,.picker,.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.header{justify-content:space-between;align-items:flex-start}
.header h1{margin:0;color:#162b4d;font-size:1.7rem;letter-spacing:-.035em}
.header p,.note,.url,.status{color:var(--muted)}
.header p{margin:7px 0 0}
.panel,.provider{border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.panel{padding:22px;margin-top:20px;box-shadow:0 10px 30px rgba(36,75,130,.07)}
.panel>h2{margin:0;font-size:1.12rem}
.note{margin:7px 0 0;line-height:1.5}
.provider{display:grid;grid-template-columns:1fr auto;gap:15px;padding:17px;margin-top:13px;box-shadow:0 3px 12px rgba(36,75,130,.045)}
.provider h2{margin:0 0 5px;font-size:1rem}
.url{margin:0;overflow-wrap:anywhere;font:.78rem ui-monospace,SFMono-Regular,Menlo,monospace}
.badges{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.badge{padding:4px 9px;border:1px solid var(--border);border-radius:999px;background:#f8fbff;color:#50627c;font-size:.72rem}
.badge.good{border-color:#c6ead8;background:#effaf4;color:var(--success)}
.models{grid-column:1/-1;border-top:1px solid var(--border);padding-top:13px}
.models summary{cursor:pointer;font-size:.84rem;font-weight:700;color:#405674}
.tools{margin:11px 0}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.check{display:flex;gap:9px;align-items:center;min-width:0;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font:.75rem ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.check:hover{border-color:#aec7ed;background:#f1f6ff}
.check input{flex:0 0 auto;width:17px;height:17px;accent-color:var(--accent)}
.picker{margin:14px 0 4px}
.picker select{min-width:220px}
.empty{padding:25px;text-align:center;border:1px dashed #cbdaf0;border-radius:12px;background:#f9fbff;color:var(--muted)}
.status{min-height:1.4em;margin:8px 0 0;font-size:.82rem}
.test-status:empty{display:none}
.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px}
.toast{max-width:min(420px,calc(100vw - 36px));padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:var(--surface);box-shadow:0 10px 28px rgba(24,49,84,.15);font-weight:700}
.toast.success{color:var(--success)}
.toast.error{color:var(--danger)}
@media(max-width:700px){.page{padding:18px 14px}.header,.provider{display:grid;grid-template-columns:1fr}.panel{padding:17px}.actions button{flex:1}.picker select{flex:1;min-width:0}.tools button{flex:1}}

</style></head><body><main class="page"><header class="header"><div><h1>Free Model Sync</h1><p>Fetch free model catalogs, choose active models, then save explicitly.</p></div><button id="reload">Reload providers</button></header><p id="status" class="status" role="status"></p><section class="panel"><h2>AI providers</h2><p class="note">Monitoring state stores provider IDs only. Model selection is read from and written to <code>openai-compatibility.models</code>.</p><div class="picker"><select id="picker" aria-label="Provider to monitor"><option value="">Add a provider…</option></select><button id="add">Add provider</button></div><div id="providers"><p class="empty">Loading…</p></div></section></main><div id="toasts" class="toasts" aria-live="polite"></div><script>
(()=>{'use strict';
const AUTH_KEY='cli-proxy-auth',PREFIX='enc::v1::',SALT='cli-proxy-api-webui::secure-storage',REFRESH_MS=60*60*1000,routes={providers:'/v0/management/openai-compatibility',config:'/v0/management/plugins/free-model-sync/config',plan:'/v0/management/plugins/free-model-sync/plan',test:'/v0/management/plugins/free-model-sync/test'};
const root=document.getElementById('providers'),picker=document.getElementById('picker'),status=document.getElementById('status'),toasts=document.getElementById('toasts');let providers=[],config={},monitors={};const catalogs=new Map();
function decode(v){if(!v||!v.startsWith(PREFIX))return v;const k=new TextEncoder().encode(`${SALT}|${location.host}|${navigator.userAgent}`),b=atob(v.slice(PREFIX.length)),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i)^k[i%k.length];return new TextDecoder().decode(o)}
function key(){try{const x=JSON.parse(decode(localStorage.getItem(AUTH_KEY))),s=x&&x.state?x.state:x;if(s&&s.managementKey)return s.managementKey}catch(_){}try{return JSON.parse(decode(localStorage.getItem('managementKey')))||''}catch(_){return''}}
async function api(path,method='GET',body){const response=await fetch(path,{method,headers:{Authorization:`Bearer ${key()}`,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let value={};try{value=await response.json()}catch(_){}if(!response.ok)throw new Error(value.error||value.message||`Request failed (${response.status})`);return value}
function toast(message,tone){const n=document.createElement('div');n.className=`toast ${tone}`;n.textContent=message;toasts.append(n);setTimeout(()=>n.remove(),4000)}function id(p){return`${p.name||''}\n${p['base-url']||''}`}function models(p){return Array.isArray(p.models)?p.models:[]}function apiKey(p){const x=(p['api-key-entries']||[]).find(x=>x&&x['api-key']);return x?x['api-key']:''}function freeName(name){return String(name).toLowerCase().split(/[-_:/.]/).includes('free')}function normalize(v){const out={};if(v&&typeof v==='object')for(const [k,s]of Object.entries(v))if(s&&typeof s==='object')out[k]={enabled:s.enabled===true,managed:[...new Set((s.managed||[]).map(String).filter(name=>!freeName(name)))]};return out}
function needsCleanup(v){return !!(v&&typeof v==='object'&&Object.values(v).some(s=>s&&typeof s==='object'&&Object.keys(s).some(k=>k!=='enabled'&&k!=='managed')))}
async function saveMonitors(){config={...config,monitors};await api(routes.config,'PATCH',{monitors})}
function monitored(){return providers.filter(p=>monitors[id(p)]&&monitors[id(p)].enabled)}
function renderPicker(){picker.replaceChildren(new Option('Add a provider…',''));for(const p of providers){const s=monitors[id(p)];if(!p.disabled&&!(s&&s.enabled))picker.add(new Option(p.name||p['base-url'],id(p)))}}
function render(){renderPicker();root.textContent='';const rows=monitored();if(!rows.length){root.innerHTML='<p class="empty">No providers monitored.</p>';return}for(const p of rows){const pid=id(p),state=monitors[pid],catalog=catalogs.get(pid),free=catalog?catalog.free:models(p).filter(m=>freeName(m.name)).map(m=>String(m.name)),active=new Set(models(p).map(m=>String(m.name))),card=document.createElement('article'),info=document.createElement('div'),title=document.createElement('h2'),url=document.createElement('p'),badges=document.createElement('div'),configured=document.createElement('span'),count=document.createElement('span'),actions=document.createElement('div'),fetchButton=document.createElement('button'),stop=document.createElement('button'),details=document.createElement('details'),summary=document.createElement('summary'),tools=document.createElement('div'),all=document.createElement('button'),none=document.createElement('button'),save=document.createElement('button'),testButton=document.createElement('button'),checks=document.createElement('div'),testStatus=document.createElement('p');card.className='provider';card.dataset.provider=pid;title.textContent=p.name;url.className='url';url.textContent=p['base-url'];badges.className='badges';configured.className='badge';configured.textContent=`${models(p).length} configured`;count.className='badge good';count.textContent=`${free.filter(x=>active.has(x)).length}/${free.length} free active`;badges.append(configured,count);info.append(title,url,badges);actions.className='actions';fetchButton.textContent='Refresh catalog';stop.textContent='Stop monitoring';stop.className='danger';actions.append(fetchButton,stop);details.className='models';summary.textContent=`Free models (${free.filter(x=>active.has(x)).length}/${free.length} active)`;tools.className='tools';all.textContent='Enable all';none.textContent='Disable all';save.textContent='Save selection';save.className='primary';save.disabled=!catalogs.has(pid);testButton.textContent='Test selected';testStatus.className='status test-status';testStatus.setAttribute('role','status');tools.append(all,none,save,testButton);checks.className='checks';details.append(summary,tools,checks,testStatus);card.append(info,actions,details);root.append(card);for(const name of free){const label=document.createElement('label'),input=document.createElement('input');label.className='check';input.type='checkbox';input.dataset.model=name;input.checked=active.has(name);label.append(input,document.createTextNode(name));checks.append(label)}if(!free.length)checks.textContent='Fetch the catalog to see all available free models.';all.onclick=()=>checks.querySelectorAll('input').forEach(x=>x.checked=true);none.onclick=()=>checks.querySelectorAll('input').forEach(x=>x.checked=false);fetchButton.onclick=async()=>{fetchButton.disabled=true;try{const result=await fetchCatalog(p);catalogs.set(pid,result);render();const next=[...root.querySelectorAll('.provider')].find(x=>x.dataset.provider===pid);if(next)next.querySelector('details').open=true;toast(`${p.name}: ${result.free.length} free models found.`,'success')}catch(e){toast(e.message,'error')}finally{fetchButton.disabled=false}};save.onclick=async()=>{save.disabled=true;try{const selected=new Set([...checks.querySelectorAll('input:checked')].map(x=>x.dataset.model)),freeSet=new Set(free),owned=new Set(state.managed),manual=models(p).filter(m=>{const name=String(m.name);return !freeSet.has(name)&&!freeName(name)&&!owned.has(name)}),source=new Map((catalog.models||[]).map(m=>[String(m.name),m])),next=[...manual,...free.filter(name=>selected.has(name)).map(name=>source.get(name)||{name,alias:name.split('/').pop().replace(/[:_.-]free$/,'')})];state.managed=free.filter(name=>selected.has(name)&&!freeName(name));await saveMonitors();await api(routes.providers,'PATCH',{name:p.name,value:{models:next}});p.models=next;count.textContent=`${selected.size}/${free.length} free active`;summary.textContent=`Free models (${selected.size}/${free.length} active)`;toast(`${p.name}: selection saved.`,'success')}catch(e){toast(e.message,'error')}finally{save.disabled=false}};testButton.onclick=async()=>{const selected=[...checks.querySelectorAll('input:checked')].map(x=>x.dataset.model);if(!selected.length){testStatus.textContent='No models selected to test.';return}testButton.disabled=true;let passed=0;const failed=[];try{for(let i=0;i<selected.length;i++){const name=selected[i];testButton.textContent='Testing '+(i+1)+'/'+selected.length+'…';testStatus.textContent='Testing '+name+'…';try{await api(routes.test,'POST',{base_url:p['base-url'],api_key:apiKey(p),headers:p.headers,model:name});passed++}catch(_){failed.push(name)}}testStatus.textContent=failed.length?passed+' passed; failed: '+failed.join(', '):passed+' model tests passed.';toast(failed.length?passed+' passed, '+failed.length+' failed.':passed+' model tests passed.',failed.length?'error':'success')}finally{testButton.disabled=false;testButton.textContent='Test selected'}};stop.onclick=async()=>{monitors[pid]={enabled:false};try{await saveMonitors();render()}catch(e){monitors[pid]={enabled:true};toast(e.message,'error')}}}}
async function fetchCatalog(p){return api(routes.plan,'POST',{base_url:p['base-url'],api_key:apiKey(p),headers:p.headers,managed:[],models:models(p)})}
async function refreshCatalogs(notify=false){const rows=monitored(),results=await Promise.allSettled(rows.map(async p=>{const result=await fetchCatalog(p);catalogs.set(id(p),result);return p.name}));render();if(notify){const failed=results.filter(x=>x.status==='rejected').length;toast(failed?`${failed} catalog refresh${failed===1?'':'es'} failed.`:`${rows.length} catalogs refreshed.`,failed?'error':'success')}}
async function load(){try{const [pp,cp]=await Promise.all([api(routes.providers),api(routes.config)]);providers=(pp['openai-compatibility']||[]).filter(p=>p&&p['base-url']);config=cp||{};const cleanup=needsCleanup(config.monitors);monitors=normalize(config.monitors);const valid=new Set(providers.map(id));let changed=false;for(const k of Object.keys(monitors))if(!valid.has(k)){delete monitors[k];changed=true}for(const p of providers){const pid=id(p);if(!(pid in monitors)&&!p.disabled&&models(p).some(m=>freeName(m.name))){monitors[pid]={enabled:true,managed:[]};changed=true}}if(changed||cleanup)await saveMonitors();render();status.textContent=`Loading ${monitored().length} monitored catalog${monitored().length===1?'':'s'}…`;await refreshCatalogs();status.textContent=`Loaded ${monitored().length} monitored provider${monitored().length===1?'':'s'}.`}catch(e){status.textContent=e.message;toast(e.message,'error')}}
document.getElementById('add').onclick=async()=>{const p=providers.find(p=>id(p)===picker.value);if(!p)return;const providerID=id(p),previous=monitors[providerID];monitors[providerID]={enabled:true,managed:[]};try{await saveMonitors()}catch(e){if(previous)monitors[providerID]=previous;else delete monitors[providerID];render();toast(e.message,'error');return}try{const catalog=await fetchCatalog(p);catalogs.set(providerID,catalog);render();const card=[...root.querySelectorAll('.provider')].find(x=>x.dataset.provider===providerID);if(card)card.querySelector('details').open=true;toast(p.name+': '+catalog.free.length+' free models found.','success')}catch(e){render();const card=[...root.querySelectorAll('.provider')].find(x=>x.dataset.provider===providerID);if(card)card.querySelector('details').open=true;toast(e.message,'error')}};document.getElementById('reload').onclick=async()=>{await refreshCatalogs(true)};load();setInterval(()=>void refreshCatalogs(),REFRESH_MS);
})();
</script></body></html>
