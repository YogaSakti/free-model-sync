name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: go

  build:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: CGO_ENABLED=1 go test ./...
      - name: Build
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p dist/stage
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.Version=$VERSION -X main.Commit=${GITHUB_SHA::7} -X main.BuildDate=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            -o dist/stage/free-model-sync.so .
          rm -f dist/stage/free-model-sync.h
          asset="free-model-sync_${VERSION}_linux_amd64.zip"
          (cd dist/stage && zip -q "../$asset" free-model-sync.so)
          (cd dist && shasum -a 256 "$asset" > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: |
            dist/free-model-sync_*.zip
            dist/checksums.txt

  publish:
    needs:
      - release
      - build
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-amd64
          path: dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            dist/free-model-sync_*.zip dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
