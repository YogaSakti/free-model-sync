name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: go

      # release-please opens a release PR instead of tagging straight away. Merging it
      # here is what keeps the flow single-step, and it needs a PAT: a merge pushed by
      # GITHUB_TOKEN does not start this workflow again, so the tag, the archive, and
      # the GitHub Release would never be produced.
      # The PR number comes from the action's own output, passed through env
      # rather than fromJSON(): a step's env is templated even when its `if` is
      # false, so fromJSON() on an empty output fails every run without a
      # release PR. The fallback asks by head branch, which reads the branch
      # directly; `gh pr list --label` goes through the search API, whose index
      # lags a few seconds behind a PR the previous step just opened.
      - name: Merge release PR
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          MERGE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          number=""
          if [ -n "$RELEASE_PR" ]; then
            # `bash -e` would abort the step if jq is missing or the output is
            # not the JSON we expect; fall through to the branch query instead.
            number=$(printf '%s' "$RELEASE_PR" | jq -r '.number // empty' || true)
          fi
          if [ -z "$number" ]; then
            number=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head release-please--branches--main \
              --json number \
              --jq '.[0].number // empty')
          fi
          if [ -z "$number" ]; then
            echo "No open release PR."
            exit 0
          fi
          if [ -z "$MERGE_TOKEN" ]; then
            echo "RELEASE_PLEASE_TOKEN is not set. Merge release PR #$number by hand to publish." >&2
            exit 1
          fi
          echo "Merging release PR #$number."
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$number" --squash --repo "$GITHUB_REPOSITORY"

  build:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: CGO_ENABLED=1 go test ./...
      - name: Build
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p dist/stage
          library="free-model-sync-v${VERSION}.so"
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.Version=$VERSION -X main.Commit=${GITHUB_SHA::7} -X main.BuildDate=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            -o "dist/stage/$library" .
          rm -f "dist/stage/${library%.so}.h"
          asset="free-model-sync_${VERSION}_linux_amd64.zip"
          (cd dist/stage && zip -q "../$asset" "$library")
          (cd dist && shasum -a 256 "$asset" > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: |
            dist/free-model-sync_*.zip
            dist/checksums.txt

  publish:
    needs:
      - release
      - build
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-amd64
          path: dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            dist/free-model-sync_*.zip dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
